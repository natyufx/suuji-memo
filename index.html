<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>数字メモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 上にヘッダー、中央にメモ欄、下3分の1にテンキー。1画面で完結。 */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --fg: #1c2420;
  --muted: #68726c;
  --line: #d6dbd6;
  --key: #ffffff;
  --key-press: #e3e9e4;
  --accent: #1d6b58;
  --accent-press: #165443;
  --accent-fg: #ffffff;
  --danger: #b3372d;
  --danger-fg: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815;
    --surface: #1b221e;
    --fg: #e8eee9;
    --muted: #94a09a;
    --line: #2d3731;
    --key: #222b26;
    --key-press: #2e3a33;
    --accent: #4fb89a;
    --accent-press: #3fa084;
    --accent-fg: #0c1a15;
    --danger: #e8837a;
    --danger-fg: #2a0f0c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815;
  --surface: #1b221e;
  --fg: #e8eee9;
  --muted: #94a09a;
  --line: #2d3731;
  --key: #222b26;
  --key-press: #2e3a33;
  --accent: #4fb89a;
  --accent-press: #3fa084;
  --accent-fg: #0c1a15;
  --danger: #e8837a;
  --danger-fg: #2a0f0c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) 33.333%;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
h1 { margin: 0; flex: 1; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
.count { color: var(--fg); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; white-space: nowrap; }

#sort, #clear {
  appearance: none;
  border: 0;
  background: var(--accent);
  color: var(--accent-fg);
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 10px 0;
  width: 5.5em;
  text-align: center;
  white-space: nowrap;
  border-radius: 10px;
  cursor: pointer;
  touch-action: manipulation;
}
#sort:active { background: var(--accent-press); }
#clear { background: var(--key); color: var(--fg); border: 1px solid var(--line); }
#clear:active { background: var(--key-press); }
#clear.armed { background: var(--danger); color: var(--danger-fg); border-color: transparent; }

#memo {
  width: 100%;
  height: 100%;
  min-height: 0;
  resize: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--fg);
  font-family: var(--font);
  font-size: 24px;
  line-height: 1.6;
  padding: 12px 14px;
  font-variant-numeric: tabular-nums;
}
#memo::placeholder { color: var(--muted); opacity: 0.7; }

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 8px;
  min-height: 0;
}
.pad button {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--key);
  color: var(--fg);
  font-family: var(--font);
  font-size: 28px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  border-radius: 10px;
  min-height: 0;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.pad button:active { background: var(--key-press); }
.pad button.sub { font-size: 20px; color: var(--muted); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <h1>数字メモ</h1>
  <button id="clear" type="button">消す</button>
  <button id="sort" type="button">昇順</button>
  <span class="count" id="count" aria-live="polite">0個</span>
</header>

<textarea id="memo" inputmode="none" spellcheck="false" aria-label="メモ" placeholder="数字を打って、改行で区切ります&#10;例: 42 → 改行 → 7 → 改行 → 105"></textarea>

<div class="pad" id="pad">
  <button type="button" data-k="7">7</button>
  <button type="button" data-k="8">8</button>
  <button type="button" data-k="9">9</button>
  <button type="button" data-k="4">4</button>
  <button type="button" data-k="5">5</button>
  <button type="button" data-k="6">6</button>
  <button type="button" data-k="1">1</button>
  <button type="button" data-k="2">2</button>
  <button type="button" data-k="3">3</button>
  <button type="button" class="sub" data-k="back" aria-label="1文字消す">⌫</button>
  <button type="button" data-k="0">0</button>
  <button type="button" class="sub" data-k="enter" aria-label="改行">改行</button>
</div>

<script>
(function () {
  var memo = document.getElementById("memo");
  var pad = document.getElementById("pad");
  var sortBtn = document.getElementById("sort");
  var countEl = document.getElementById("count");
  var KEY = "suuji-memo-text";
  function count() {
    var n = memo.value.split(/[\s,、]+/).filter(Boolean).length;
    countEl.textContent = n + "個";
  }
  function toEnd() { memo.scrollTop = memo.scrollHeight; }

  try { var saved = localStorage.getItem(KEY); if (saved) memo.value = saved; } catch (e) {}

  function save() { try { localStorage.setItem(KEY, memo.value); } catch (e) {} }
  function update() { save(); count(); toEnd(); }

  function insert(text) {
    var s = memo.selectionStart, e = memo.selectionEnd;
    memo.setRangeText(text, s, e, "end");
    memo.focus({ preventScroll: true });
    update();
  }
  function backspace() {
    var s = memo.selectionStart, e = memo.selectionEnd;
    if (s !== e) { memo.setRangeText("", s, e, "end"); }
    else if (s > 0) { memo.setRangeText("", s - 1, s, "end"); }
    memo.focus({ preventScroll: true });
    update();
  }

  // ボタンを押してもメモ欄のカーソル位置を保つ
  pad.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
  sortBtn.addEventListener("mousedown", function (ev) { ev.preventDefault(); });

  // 「消す」は誤タップ防止のため、3秒以内にもう一度押すと全消去
  var clearBtn = document.getElementById("clear");
  var armTimer;
  clearBtn.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
  function disarm() {
    clearTimeout(armTimer);
    clearBtn.classList.remove("armed");
    clearBtn.textContent = "消す";
  }
  clearBtn.addEventListener("click", function () {
    if (!clearBtn.classList.contains("armed")) {
      clearBtn.classList.add("armed");
      clearBtn.textContent = "本当に?";
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    memo.value = "";
    save();
    count();
    memo.focus({ preventScroll: true });
  });

  pad.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    var k = b.getAttribute("data-k");
    if (k === "back") backspace();
    else if (k === "enter") insert("\n");
    else insert(k);
  });

  sortBtn.addEventListener("click", function () {
    var tokens = memo.value.split(/[\s,、]+/).filter(Boolean);
    if (!tokens.length) return;
    var nums = tokens.filter(function (t) { return !isNaN(Number(t)); });
    var others = tokens.filter(function (t) { return isNaN(Number(t)); });
    nums.sort(function (a, b) { return Number(a) - Number(b); });
    memo.value = nums.concat(others).join("\n");
    memo.selectionStart = memo.selectionEnd = memo.value.length;
    memo.scrollTop = 0;
    save();
    count();
  });

  memo.addEventListener("input", update);
  count();
  toEnd();
})();
</script>

</html>
